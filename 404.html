<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Alpha Sound Engineering</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Alpha Sound Engineering - shared styles (clean corporate light) */
:root{
  --ink:#14161A;--text:#303744;--muted:#566070;--line:#CDD4DF;--soft:#E4E9F1;--bg:#fff;
  --gold:#F2C14E;--golddk:#8A5F00;--wa:#25D366;--r:14px;--shadow:0 12px 32px rgba(20,22,26,.09);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.7 Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--golddk);outline-offset:3px}
h1,h2,h3{color:var(--ink);font-family:Roboto,system-ui,sans-serif;font-weight:900;line-height:1.1;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(36px,5.4vw,62px)}
h2{font-size:clamp(28px,3.6vw,42px)}
h3{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
p{margin:0 0 16px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.skip{position:absolute;left:-9999px;top:8px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--golddk);margin:0 0 16px}
.lead{font-size:19px;color:var(--muted);max-width:58ch}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15.5px/1.2 Roboto,system-ui,sans-serif;text-decoration:none;padding:15px 28px;border-radius:999px;border:2px solid transparent;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#2B313B}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:#F7D274}
.btn-wa{background:var(--wa);color:#0B2E17}
.btn-wa:hover{background:#3CE07C}
.btn-outline{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-outline:hover{background:var(--ink);color:#fff}
.btn-outline-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.btn-outline-light:hover{background:#fff;color:var(--ink)}
.btn-sm{padding:10px 20px;font-size:14.5px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.sub-cta{margin:18px 0 0;font-size:15px}
.sub-cta a{font-weight:700;text-underline-offset:4px;text-decoration-color:var(--gold);text-decoration-thickness:2px}
.sub-cta a:hover{color:var(--golddk)}
.arrow-link{font-weight:700;text-decoration:none;color:var(--ink);border-bottom:2px solid var(--gold);padding-bottom:2px}
.arrow-link:hover{color:var(--golddk)}

/* Header */
.site-header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-wrap{display:flex;align-items:center;justify-content:space-between;height:72px;position:relative}
.logo{font-family:Roboto,system-ui,sans-serif;font-weight:900;font-size:28px;letter-spacing:.12em;white-space:nowrap;text-decoration:none;color:var(--ink)}
@media (max-width:700px){.logo{font-size:21px;letter-spacing:.08em}}
nav ul{display:flex;align-items:center;gap:4px;list-style:none;margin:0;padding:0}
nav a:not(.btn){display:block;padding:10px 14px;text-decoration:none;font-weight:700;font-size:15px;color:var(--text);border-radius:8px}
nav a:not(.btn):hover{background:var(--soft);color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--gold);border-radius:0}
nav li:last-child{margin-left:10px}
.nav-toggle{display:none;width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0}
.nav-toggle span{display:block;width:20px;height:2px;background:var(--ink);border-radius:2px}

/* Hero */
.hero{padding:72px 0 64px;background:linear-gradient(180deg,#fff 0,var(--soft) 100%)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{margin-bottom:22px}
.hero .lead{margin-bottom:30px}
.hero-img{border-radius:22px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/3;background:var(--line)}
.hero-img img{width:100%;height:100%;object-fit:cover}

/* Home hero: full-width photo background with animated level meter */
.hero-dark{padding:96px 0 84px;background:linear-gradient(90deg,rgba(20,22,26,.94) 35%,rgba(20,22,26,.6)),#14161A url(images/mixing-desk.webp) center/cover;border-bottom:1px solid var(--ink)}
.hero-dark h1{color:#fff}
.hero-dark .eyebrow{color:var(--gold)}
.hero-dark .lead{color:#C9CFD9}
.hero-dark .sub-cta a{color:#fff;text-decoration-color:var(--gold)}
.hero-dark .sub-cta a:hover{color:var(--gold)}
.meter{background:var(--ink);border-radius:22px;padding:28px 26px 22px;display:flex;gap:10px;align-items:flex-end;height:300px;box-shadow:0 20px 50px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.08)}
.meter i{flex:1;height:100%;display:flex;flex-direction:column-reverse;gap:4px;justify-content:flex-start}
.meter i b{display:block;height:100%;border-radius:3px;background:linear-gradient(to top,#3DDC84 0 55%,var(--gold) 55% 82%,#F0554A 82%);transform-origin:bottom;animation:lvl 1.6s ease-in-out infinite alternate;-webkit-mask:repeating-linear-gradient(to top,#000 0 9px,transparent 9px 13px);mask:repeating-linear-gradient(to top,#000 0 9px,transparent 9px 13px)}
@keyframes lvl{from{clip-path:inset(var(--a) 0 0 0)}to{clip-path:inset(var(--b) 0 0 0)}}
.meter i:nth-child(1) b{--a:30%;--b:55%}
.meter i:nth-child(2) b{--a:10%;--b:40%;animation-delay:-.4s}
.meter i:nth-child(3) b{--a:45%;--b:20%;animation-delay:-.9s}
.meter i:nth-child(4) b{--a:20%;--b:60%;animation-delay:-.2s}
.meter i:nth-child(5) b{--a:5%;--b:35%;animation-delay:-1.1s}
.meter i:nth-child(6) b{--a:40%;--b:15%;animation-delay:-.6s}
.meter i:nth-child(7) b{--a:25%;--b:50%;animation-delay:-.3s}

/* Inner page header */
.page-hero{padding:64px 0 48px;background:var(--soft);border-bottom:1px solid var(--line)}
.page-hero h1{font-size:clamp(34px,5vw,54px);margin-bottom:16px}
.crumbs{font-size:14px;color:var(--muted);margin:0 0 14px}
.crumbs a{text-decoration:none;font-weight:700}
.crumbs a:hover{color:var(--golddk)}

/* Trust strip */
.strip{border-block:1px solid var(--line);background:#fff}
.strip-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.strip-grid div{padding:24px 22px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.strip-grid div:first-child{border-left:0;padding-left:0}
.strip-grid b{color:var(--ink);font-weight:700;font-size:16px}
.strip-grid span{font-size:14.5px;color:var(--muted);line-height:1.5}

/* Sections */
.section{padding:88px 0}
.section.soft{background:var(--soft);border-block:1px solid var(--line)}
.section.soft .card,.section.soft .checks li,.section.soft .steps li{background:#fff}
.section-head{max-width:62ch;margin-bottom:40px}
.section-head p{color:var(--muted);margin:14px 0 0}
.section-foot{margin-top:32px}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:28px;transition:transform .2s,box-shadow .2s,border-color .2s}
.card::before{content:"";display:block;width:36px;height:4px;border-radius:4px;background:var(--gold);margin-bottom:18px}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#CFD5DE}
.card h3{margin-bottom:8px}
.card p{margin:0;font-size:15.5px;color:var(--muted);line-height:1.6}
.card .arrow-link{display:inline-block;margin-top:16px;font-size:14.5px}
.group{margin-bottom:56px}
.group:last-of-type{margin-bottom:0}
.group h2{font-size:clamp(24px,3vw,32px);margin-bottom:22px}

/* Split sections */
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start}
.split p{color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.checks li{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 18px 56px;position:relative;color:var(--ink);font-weight:700;line-height:1.5}
.checks li::before{content:"";position:absolute;left:20px;top:21px;width:20px;height:20px;border-radius:50%;background:var(--gold)}
.checks li::after{content:"";position:absolute;left:27px;top:25px;width:5px;height:10px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}

/* Photo grids */
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.preview figure,.gallery figure{margin:0;border-radius:12px;overflow:hidden;background:var(--line)}
.preview figure{aspect-ratio:4/5}
.preview img,.gallery img{width:100%;height:100%;object-fit:cover}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:280px;gap:14px}
.gallery figure:nth-child(1){grid-row:span 2}
.gallery figure:nth-child(6){grid-column:span 2}
.ph{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in;overflow:hidden}
.ph img{transition:transform .5s}
.ph:hover img{transform:scale(1.05)}
.ph:focus-visible{outline-offset:-4px}

/* Steps */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.steps li{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.steps b{display:block;font-family:Roboto,system-ui,sans-serif;font-weight:900;font-size:46px;color:var(--gold);line-height:1;margin-bottom:12px}
.steps h3{margin-bottom:8px}
.steps p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.6}

/* Dark call band */
.band{background:var(--ink);color:#fff;text-align:center;padding:80px 0}
.band h2{color:#fff;margin-bottom:14px}
.band p{color:#B9C0CC;max-width:48ch;margin:0 auto 24px}
.phone{display:inline-block;font-family:Roboto,system-ui,sans-serif;font-weight:900;font-size:clamp(34px,7vw,68px);line-height:1.1;text-decoration:none;color:var(--gold);margin-bottom:28px;letter-spacing:.02em}
.band .cta{justify-content:center}

/* Contact */
.contact-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:-28px;position:relative}
.contact-cards .card{box-shadow:var(--shadow)}
.contact-cards .big{font-weight:900;color:var(--ink);font-size:20px;display:block;margin:2px 0 14px;text-decoration:none}
.form-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}
.form-side p{color:var(--muted)}
.form-side ul{margin:0;padding-left:20px;color:var(--muted)}
form.quote{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:32px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 1fr;gap:18px}
form.quote .full{grid-column:1/-1}
label{display:block;font-weight:700;font-size:14.5px;color:var(--ink);margin-bottom:6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #C5CCD7;border-radius:10px;padding:13px 14px}
textarea{min-height:130px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--gold);outline-offset:0;border-color:var(--ink)}
.hint{font-size:14px;color:var(--muted);margin:0}
.form-note{background:#E9F8EF;border:1px solid #B6E6C8;color:#134D2A;border-radius:10px;padding:14px 16px;font-size:15px;margin:0}
.area{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}

/* FAQ */
.faq{max-width:820px}
.faq details{border-bottom:1px solid var(--line)}
.faq details:first-child{border-top:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 4px;font-weight:700;color:var(--ink);font-size:18px;line-height:1.35}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:22px;font-weight:700;line-height:1}
.faq details[open] summary::after{content:"\2013";background:var(--gold)}
.faq details p{padding:0 56px 22px 4px;margin:0;color:var(--muted)}

/* Footer */
.site-footer{background:var(--soft);border-top:1px solid var(--line);padding:56px 0 28px}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}
.site-footer h3{font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;color:var(--ink)}
.site-footer p,.site-footer li{font-size:15px;color:var(--muted);line-height:1.7}
.site-footer ul{list-style:none;margin:0;padding:0}
.site-footer a{text-decoration:none;font-weight:700;color:var(--text)}
.site-footer a:hover{color:var(--golddk)}
.foot-logo{font-family:Roboto,system-ui,sans-serif;font-weight:900;font-size:26px;letter-spacing:.16em;color:var(--ink);display:block;margin-bottom:10px}
.legal{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}

/* Lightbox */
#lb{border:0;padding:0;background:transparent;max-width:94vw;max-height:94vh;overflow:visible}
#lb::backdrop{background:rgba(10,11,13,.9)}
#lb img{display:block;max-width:94vw;max-height:88vh;border-radius:10px;margin:0 auto}
#lb button{position:absolute;width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:var(--ink);font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center}
#lb .lb-close{top:-16px;right:-8px}
#lb .lb-prev{left:-8px;top:50%;transform:translateY(-50%)}
#lb .lb-next{right:-8px;top:50%;transform:translateY(-50%)}

/* Reveal on scroll (only applied when JS runs) */
.rv{transition:opacity .6s,transform .6s}
.rv.pre{opacity:0;transform:translateY(18px)}
.rv.in{opacity:1;transform:none}

/* Mobile call bar */
.bar{display:none}

@media(max-width:860px){
  body{padding-bottom:78px}
  .nav-toggle{display:flex}
  nav{position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:1px solid var(--line);display:none;padding:10px 24px 20px;box-shadow:0 18px 30px rgba(20,22,26,.08)}
  nav.open{display:block}
  nav ul{flex-direction:column;align-items:stretch;gap:2px}
  nav li:last-child{margin:10px 0 0}
  nav li:last-child .btn{display:flex}
  nav a[aria-current="page"]{box-shadow:inset 3px 0 0 var(--gold);border-radius:0 8px 8px 0}
  .hero{padding:44px 0 40px}
  .hero-dark{padding:44px 0 40px;background:linear-gradient(rgba(20,22,26,.9),rgba(20,22,26,.8)),#14161A url(images/mixing-desk.webp) center/cover}
  .meter{height:200px}
  .hero-grid,.split,.form-grid,.foot-grid{grid-template-columns:1fr;gap:32px}
  .hero-img{aspect-ratio:16/10}
  .section{padding:56px 0}
  .band{padding:56px 0}
  .strip-grid{grid-template-columns:1fr 1fr}
  .strip-grid div,.strip-grid div:first-child{padding:18px 16px;border-left:0;border-top:1px solid var(--line)}
  .strip-grid div:nth-child(-n+2){border-top:0}
  .strip-grid div:nth-child(even){border-left:1px solid var(--line)}
  .preview{grid-template-columns:1fr 1fr}
  .gallery{grid-template-columns:1fr 1fr;grid-auto-rows:200px}
  .gallery figure:nth-child(6){grid-column:span 1}
  .steps,.contact-cards,.area{grid-template-columns:1fr}
  .contact-cards{margin-top:-20px}
  form.quote{grid-template-columns:1fr;padding:22px}
  .faq details p{padding-right:4px}
  .page-hero{padding:44px 0 36px}
  .bar{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .bar .btn{flex:1;padding:13px 10px}
  #lb .lb-close{top:-14px;right:-4px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv,.btn,.card,.ph img{transition:none}
  .meter i b{animation:none;--a:25%!important}
  .rv.pre{opacity:1;transform:none}
}
</style>
</head><body>
<main class="section" style="min-height:100vh;display:grid;align-items:center"><div class="wrap" style="text-align:center">
<a class="logo" href="/" style="display:inline-block;margin-bottom:28px">ALFA SOUNDS</a>
<h1 style="margin-bottom:16px">Page not found</h1>
<p class="lead" style="margin:0 auto 28px">That page does not exist or has moved. Head back to the homepage, or call Alpha directly.</p>
<div class="cta" style="justify-content:center"><a class="btn btn-primary" href="/">Go to homepage</a><a class="btn btn-outline" href="tel:+263776229138">Call +263 776 229 138</a></div>
</div></main>
</body></html>
